server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container. The browser only ever talks
    # to THIS origin (port 8038), so the API does not need to be reachable
    # from outside - this is what fixes "data on the server but nothing on
    # the website". `resolver` + a variable make nginx re-resolve the
    # container name so a backend restart does not leave a stale IP.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://weather-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Fonts, icons and images rarely change: cache them for a month.
    location ~* \.(?:woff2|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # HTML, JS, CSS, manifest and the service worker must always be
    # revalidated so deploys show up on the next load (no stale pages).
    location ~* \.(?:html|js|css|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
