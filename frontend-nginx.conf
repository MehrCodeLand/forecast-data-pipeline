server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fonts, icons and images rarely change: cache them for a month.
    location ~* \.(?:woff2|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # HTML, JS, CSS, manifest and the service worker must always be
    # revalidated so deploys show up on the next load (no stale pages).
    # no-cache still allows 304 responses, so it stays fast.
    location ~* \.(?:html|js|css|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
