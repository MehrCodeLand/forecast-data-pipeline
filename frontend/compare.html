<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        /* Apply saved theme and language before first paint to avoid a flash
           of the wrong colors or text direction. Mirrors i18n.js defaults. */
        (function () {
            try {
                var lang = localStorage.getItem('lang');
                if (lang !== 'en' && lang !== 'fa') { lang = 'fa'; }
                var theme = localStorage.getItem('theme');
                if (theme !== 'light' && theme !== 'dark') {
                    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
                }
                var de = document.documentElement;
                de.lang = lang;
                de.dir = lang === 'fa' ? 'rtl' : 'ltr';
                de.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <meta name="theme-color" content="#0d1117">
    <title>Compare - HavaChetor</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1 id="site-name">HavaChetor</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" data-i18n="nav_home">Home</a></li>
                <li><a href="cities.html" data-i18n="nav_cities">Cities</a></li>
                <li><a href="compare.html" class="active" data-i18n="nav_compare">Compare</a></li>
                <li><a href="info.html" data-i18n="nav_info">Info</a></li>
            </ul>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-label="Toggle theme">
                    <svg class="theme-ic theme-ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="3.5"/><line x1="12" y1="20.5" x2="12" y2="22.5"/><line x1="3.5" y1="3.5" x2="4.9" y2="4.9"/><line x1="19.1" y1="19.1" x2="20.5" y2="20.5"/><line x1="1.5" y1="12" x2="3.5" y2="12"/><line x1="20.5" y1="12" x2="22.5" y2="12"/><line x1="3.5" y1="20.5" x2="4.9" y2="19.1"/><line x1="19.1" y1="4.9" x2="20.5" y2="3.5"/></g></svg>
                    <span class="theme-knob"></span>
                    <svg class="theme-ic theme-ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
                </button>
                <button id="donate-link" class="donate-btn" type="button" aria-label="Buy me a coffee">☕</button>
                <button id="lang-toggle" class="btn btn-secondary lang-btn" type="button">EN</button>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <div class="header">
            <h2 data-i18n="compare_title">Compare Cities</h2>
            <div class="controls">
                <label for="period" data-i18n="period_label">Period (records):</label>
                <input type="number" id="period" value="24" min="2" max="500">
            </div>
        </div>
        <p class="page-lead" data-i18n="compare_pick">Pick 2 to 4 cities and see their temperature and wind side by side.</p>

        <div id="error" class="error" style="display: none;"></div>

        <div class="card">
            <h3 data-i18n="nav_cities">Cities</h3>
            <div id="city-picker" class="picker-grid">
                <p data-i18n="loading">Loading...</p>
            </div>
            <button id="compare-btn" class="btn" data-i18n="compare_btn">Compare</button>
        </div>

        <div id="compare-results" style="display: none;">
            <div class="card">
                <h3 data-i18n="compare_table_title">Side by Side</h3>
                <div class="table-container">
                    <table id="compare-table"></table>
                </div>
            </div>

            <div class="card-grid chart-grid">
                <div class="card">
                    <h3 data-i18n="temp_trend">Temperature over time</h3>
                    <div id="compare-temp-chart" class="chart-container"></div>
                </div>
                <div class="card">
                    <h3 data-i18n="wind_trend">Wind speed over time</h3>
                    <div id="compare-wind-chart" class="chart-container"></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p id="footer-text" data-i18n="default_footer">Weather Analysis System</p>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="i18n.js"></script>
    <script src="api.js"></script>
    <script src="chart.js"></script>
    <script src="compare.js"></script>
</body>
</html>
