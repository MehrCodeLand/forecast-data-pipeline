<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        /* Apply saved theme and language before first paint to avoid a flash
           of the wrong colors or text direction. Mirrors i18n.js defaults. */
        (function () {
            try {
                var lang = localStorage.getItem('lang');
                if (lang !== 'en' && lang !== 'fa') { lang = 'fa'; }
                var theme = localStorage.getItem('theme');
                if (theme !== 'light' && theme !== 'dark') {
                    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
                }
                var de = document.documentElement;
                de.lang = lang;
                de.dir = lang === 'fa' ? 'rtl' : 'ltr';
                de.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <meta name="theme-color" content="#0d1117">
    <title>Cities - Weather Watch</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1 id="site-name">Weather Watch</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" data-i18n="nav_home">Home</a></li>
                <li><a href="cities.html" class="active" data-i18n="nav_cities">Cities</a></li>
                <li><a href="compare.html" data-i18n="nav_compare">Compare</a></li>
                <li><a href="info.html" data-i18n="nav_info">Info</a></li>
            </ul>
            <div class="nav-actions">
                <button id="theme-toggle" class="btn btn-secondary icon-btn" type="button" aria-label="Toggle theme"></button>
                <button id="donate-link" class="donate-btn" type="button" aria-label="Buy me a coffee">☕</button>
                <button id="lang-toggle" class="btn btn-secondary lang-btn" type="button">EN</button>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <div class="header">
            <h2 data-i18n="cities_title">Cities</h2>
        </div>
        <p class="page-lead" data-i18n="pick_city">Pick a city to open its dashboard with temperature, wind and raw data analytics.</p>

        <div id="loading" class="loading" data-i18n="loading">Loading...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div class="card">
            <h3 data-i18n="map_title">Live Map</h3>
            <p data-i18n="map_note">Every dot is a tracked city. Hover for the latest conditions; click to open its dashboard.</p>
            <div id="city-map"></div>
        </div>

        <div id="cities-grid" class="card-grid"></div>
    </div>

    <footer>
        <div class="container">
            <p id="footer-text" data-i18n="default_footer">Weather Analysis System</p>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="i18n.js"></script>
    <script src="api.js"></script>
    <script src="world-map.js"></script>
    <script src="map.js"></script>
    <script src="cities.js"></script>
</body>
</html>
