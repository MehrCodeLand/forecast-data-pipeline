<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        /* Apply saved theme and language before first paint to avoid a flash
           of the wrong colors or text direction. Mirrors i18n.js defaults. */
        (function () {
            try {
                var lang = localStorage.getItem('lang');
                if (lang !== 'en' && lang !== 'fa') { lang = 'fa'; }
                var theme = localStorage.getItem('theme');
                if (theme !== 'light' && theme !== 'dark') {
                    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
                }
                var de = document.documentElement;
                de.lang = lang;
                de.dir = lang === 'fa' ? 'rtl' : 'ltr';
                de.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <meta name="theme-color" content="#0d1117">
    <meta name="description" content="News and updates about the weather data project">
    <title>News - HavaChetor</title>

            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
