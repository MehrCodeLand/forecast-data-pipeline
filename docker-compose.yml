version: '3.8'

services:
  weather-api:
    build: .
    container_name: weather-api
    ports:
      - "8342:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Tehran
      - FETCH_INTERVAL_MINUTES=${FETCH_INTERVAL_MINUTES:-60}
      # Set OPENWEATHER_API_KEY in a .env file next to this compose file to
      # collect richer weather + air pollution from OpenWeather. Empty ->
      # the keyless Open-Meteo source is used.
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: weather-frontend
    ports:
      - "8038:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - weather-api
    restart: unless-stopped